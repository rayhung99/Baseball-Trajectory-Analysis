name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
      
      - name: Install dependencies
        run: |
          cd mobile
          npm ci
          cd ios && pod install && cd ..
      
      - name: Set up signing
        run: |
          # 建立暫存目錄放憑證
          mkdir -p ~/signing
          
          # 解碼並放置簽名憑證
          echo "${{ secrets.IOS_SIGNING_CERT }}" | base64 -D > ~/signing/cert.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > ~/signing/profile.mobileprovision
          
          # 安裝憑證到 keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import ~/signing/cert.p12 -k build.keychain -P "${{ secrets.IOS_SIGNING_CERT_PASSWORD }}" -A
          
          # 複製 provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ~/signing/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      
      - name: Build with xcodebuild
        run: |
          cd mobile/ios
          xcodebuild \
            -workspace SpeedGun.xcworkspace \
            -scheme SpeedGun \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/SpeedGun.xcarchive \
            archive
      
      - name: Export IPA
        run: |
          cd mobile/ios
          xcodebuild \
            -exportArchive \
            -archivePath build/SpeedGun.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
      
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: SpeedGun.ipa
          path: mobile/ios/build/export/SpeedGun.ipa
